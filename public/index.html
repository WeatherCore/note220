<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>note220 · 快传</title>
  <script>
    // 首屏数据请求提前到 <head> 发起:与后面的样式/字体/HTML 解析完全并行,
    // 省掉「HTML 下载完 → 跑到 body 末尾才开始请求 API」的一整个来回。
    // 结果挂在 window.__firstFetch 上,由 body 末尾的 boot() 消费一次。
    window.__firstFetch = (function () {
      try {
        var p = new URLSearchParams(location.hash.replace(/^#/, ''));
        var room = p.get('r') || 'main';
        if (!/^[a-zA-Z0-9_-]{1,32}$/.test(room)) room = 'main';
        return fetch('/api/messages?room=' + encodeURIComponent(room));
      } catch (e) {
        return null;
      }
    })();
  </script>
  <!-- 字体已改为自托管(/fonts.css + /fonts/*.woff2),并用 media 交换技巧异步加载:
       渲染完全不阻塞,先用系统字体立刻出内容,woff2 到货后 swap。
       之前外链 fonts.googleapis.com 在国内是重灾区——渲染阻塞的 CSS 请求挂起,
       整页白屏干等,这是「其他设备打不开/慢」的最大原因。 -->
  <link rel="stylesheet" href="/fonts.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/fonts.css"></noscript>
  <style>
    /* ============================================================
       note220 · 视觉系统
       走向:亮色 Swiss / Flat — 暖灰 stone + 深墨黑主色 + 克制绿状态色
       字体:IBM Plex Sans (UI) + JetBrains Mono (URL / 令牌 / ID / hash)
       设计取舍:远离 SaaS 蓝(#4a90e2),靠 1px 边框分层而非阴影,
                 等宽只用在字符型内容上,中文走 sans 避免 fallback 错位
       ============================================================ */
    :root {
      /* 颜色:暖灰 stone 系,主 CTA 直接深墨黑实心,绿/红只做状态色 */
      --bg:           #FAFAF9;   /* stone-50,微暖纸张感,不是死板白 */
      --fg:           #1C1917;   /* stone-900,正文与标题 */
      --muted:        #78716C;   /* stone-500,占位符 / 二级辅助,对白底 4.6:1 达 AA */
      --muted-2:      #57534E;   /* stone-600,时间戳 / hint,对背景 5.4:1 达 AA */
      --card:         #FFFFFF;
      --border:       #E7E5E4;   /* stone-200,消息项分隔线 */
      --border-strong:#D6D3D1;   /* stone-300,输入框 / chip 边框 */
      --accent:       #1C1917;   /* 主 CTA 按钮:深墨黑实心,文字白 */
      --on-accent:    #FFFFFF;
      --success:      #15803D;   /* green-700,只用在「已复制」等状态反馈 */
      --danger:       #B91C1C;   /* red-700,错误信息 */
      --ring:         rgba(28, 25, 23, 0.10);  /* focus ring,半透明黑 */
      /* 形态与节奏 */
      --radius:    4px;          /* Swiss 小圆角,克制 */
      --radius-lg: 8px;          /* 令牌卡片用 */
      --t-fast:    120ms;        /* hover / focus */
      --t-base:    180ms;        /* 状态切换 */
      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 96px;
    }

    /* ===== 顶栏 ===== */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: var(--fg);
      letter-spacing: -0.01em;
    }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .mini-btn {
      /* 修复:padding 从 4px 10px → 8px 14px,触摸目标 ~28×32 达 web-target-size */
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--t-fast) ease, border-color var(--t-fast) ease;
      min-height: 32px;
      line-height: 1.2;
    }
    .mini-btn:hover {
      background: #F5F5F4;            /* stone-100 */
      border-color: var(--fg);
    }
    .mini-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    /* 焚毁按钮:danger 红调,hover 强化,与普通 mini-btn 同构 */
    .mini-btn.burn-btn {
      color: var(--danger);
      border-color: #E4B6B6;
    }
    .mini-btn.burn-btn:hover {
      background: #FCEBEB;
      border-color: var(--danger);
    }
    .mini-btn:disabled {
      color: var(--muted);
      border-color: var(--border);
      cursor: not-allowed;
      background: transparent;
    }

    .hint {
      font-size: 12px;
      color: var(--muted-2);
      margin: 8px 0 20px;
      line-height: 1.65;
    }
    .chip {
      color: var(--fg);
      cursor: pointer;
      border-bottom: 1px solid var(--border-strong);
      padding-bottom: 1px;
      transition: border-color var(--t-fast) ease;
    }
    .chip:hover { border-bottom-color: var(--fg); }
    .chip:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* ===== 令牌输入页 ===== */
    .auth-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-box {
      width: 100%;
      max-width: 380px;
      padding: 40px 28px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);  /* 极轻阴影,主要靠边框分层 */
    }
    .auth-box h1 {
      text-align: center;
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .auth-box .hint {
      text-align: center;
      margin: 0 0 24px;
    }
    .auth-box input[type=password] {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      /* 令牌输入用 mono,凸显「密钥」字符感 */
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      margin-bottom: 14px;
      outline: none;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease;
    }
    .auth-box input[type=password]:focus {
      border-color: var(--fg);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .auth-box input[type=password]::placeholder { color: var(--muted); }

    .remember {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--muted-2);   /* 修复:#888 → stone-600,达 AA */
      margin-bottom: 18px;
      cursor: pointer;
      line-height: 1.55;
    }
    .remember input { margin-top: 2px; }

    .auth-box button {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity var(--t-fast) ease;
    }
    .auth-box button:hover { opacity: 0.85; }
    .auth-box button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    .auth-box button:disabled {
      background: var(--border-strong);
      color: var(--muted-2);
      cursor: not-allowed;
    }
    .auth-box .err {
      color: var(--danger);
      font-size: 12px;
      margin-top: 14px;
      min-height: 16px;
      text-align: center;
    }

    /* ===== 留言板 composer ===== */
    .composer {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: stretch;
    }
    .composer textarea {
      flex: 1;
      padding: 12px 14px;
      font-size: 13px;
      font-family: var(--font-sans);
      line-height: 1.55;
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      resize: vertical;
      min-height: 76px;
      outline: none;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease;
    }
    .composer textarea:focus {
      border-color: var(--fg);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .composer textarea::placeholder { color: var(--muted); }
    .composer button {
      padding: 0 22px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity var(--t-fast) ease;
      min-height: 44px;          /* 修复:满足 touch-target-size */
    }
    .composer button:hover { opacity: 0.85; }
    .composer button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    .composer button:disabled {
      background: var(--border-strong);
      color: var(--muted-2);
      cursor: not-allowed;
    }
    .composer-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 24px;
      line-height: 1.55;
    }
    .composer { align-items: flex-end; }  /* 覆盖 stretch:图片/发送按钮沉底对齐 */

    /* composer 内联错误:发送/上传失败落在这里(role=alert,屏幕阅读器会播报),
       不再用 alert() 打断;空的时候 hidden 不占位 */
    .composer-err {
      font-size: 12px;
      color: var(--danger);
      margin: 0 0 8px;
      line-height: 1.55;
    }
    .composer-err[hidden] { display: none; }

    /* ===== 待发图片条 + 上传进度 ===== */
    .attach-strip {
      display: flex;
      flex-direction: column;          /* 主行 + 进度行,上下堆叠 */
      gap: 6px;
      padding: 6px 8px;
      margin-top: 8px;                 /* 位于 composer 行下方 */
      background: var(--card);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
    }
    /* 关键:display:flex 会盖掉 hidden 属性的 UA 默认 display:none,
       必须显式声明,否则没选图时这行也一直占着地方 */
    .attach-strip[hidden] { display: none; }
    .strip-main { display: flex; align-items: center; gap: 10px; width: 100%; }
    .attach-thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .attach-meta {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: var(--muted-2);
      line-height: 1.5;
    }
    .attach-name {
      display: block;
      font-weight: 500;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attach-remove {
      padding: 4px 10px;
      font-size: 11px;
      font-family: var(--font-sans);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted-2);
      cursor: pointer;
      flex-shrink: 0;
      min-height: 28px;
      transition: color var(--t-fast) ease, border-color var(--t-fast) ease;
    }
    .attach-remove:hover { color: var(--danger); border-color: var(--danger); }
    .attach-remove:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    /* 上传进度行:20MB 原图直传在宿舍 WiFi 下要几十秒,
       黑盒等待不可接受 —— 进度条 + 已传/总量 + 取消按钮 */
    .strip-up { display: flex; align-items: center; gap: 10px; width: 100%; }
    .strip-up[hidden] { display: none; }
    .up-bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .up-fill {
      height: 100%;
      width: 0%;
      background: var(--fg);
      transition: width 150ms ease;
    }
    .up-pct {
      font-size: 11px;
      color: var(--muted-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .up-cancel {
      padding: 4px 10px;
      font-size: 11px;
      font-family: var(--font-sans);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted-2);
      cursor: pointer;
      flex-shrink: 0;
      min-height: 28px;
      transition: color var(--t-fast) ease, border-color var(--t-fast) ease;
    }
    .up-cancel:hover { color: var(--danger); border-color: var(--danger); }
    .up-cancel:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* ===== 内联面板(换房 / 改名):替代阻塞式 prompt,
       手机上不再弹系统对话框,面板内可以放最近房间 chip ===== */
    .inline-panel {
      margin: 0 0 16px;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .inline-panel[hidden] { display: none; }
    .inline-panel h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .panel-row { display: flex; gap: 8px; }
    .panel-row input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 13px;
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      outline: none;
      transition: border-color var(--t-fast) ease, box-shadow var(--t-fast) ease;
    }
    .panel-row input:focus {
      border-color: var(--fg);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .panel-btn {
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      min-height: 40px;
      flex-shrink: 0;
      transition: opacity var(--t-fast) ease;
    }
    .panel-btn:hover { opacity: 0.85; }
    .panel-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    .panel-btn.ghost {
      background: transparent;
      color: var(--muted-2);
      border: 1px solid var(--border-strong);
      font-weight: 500;
    }
    .panel-btn.ghost:hover { background: #F5F5F4; color: var(--fg); border-color: var(--fg); }
    .panel-foot { margin-top: 10px; }
    .recent-label {
      font-size: 11px;
      color: var(--muted-2);
      margin: 12px 0 6px;
    }
    .recent-rooms { display: flex; flex-wrap: wrap; gap: 6px; }
    .rr-chip {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: var(--fg);
      min-height: 28px;
      transition: background var(--t-fast) ease, border-color var(--t-fast) ease;
    }
    .rr-chip:hover { background: #F5F5F4; border-color: var(--fg); }
    .rr-chip:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* ===== 留言列表 ===== */
    .messages { list-style: none; padding: 0; margin: 0; }
    .message {
      display: flex;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .message:last-child { border-bottom: none; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
      /* 修复:随机 hsl 头像在浅背景上扎眼 → 降饱和 + 1px 内描边柔化 */
      filter: saturate(0.7);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    .msg-body { flex: 1; min-width: 0; }
    .msg-meta {
      font-size: 12px;
      color: var(--muted-2);     /* 修复:#888 → stone-600,达 AA */
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .msg-author {
      /* 去掉背景色 chip,改纯文字加粗;author 多是 #hash 形式,用 mono 凸显字符感 */
      font-weight: 600;
      font-size: 12px;
      color: var(--fg);
      font-family: var(--font-mono);
    }
    .msg-actions {
      /* 动作按钮容器:吃掉 meta 行剩余空间,把按钮组统一推到右侧
         (此前 margin-left:auto 写在 copy-btn 上,纯图消息没有右靠参照) */
      margin-left: auto;
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
    }
    .copy-btn {
      /* 触摸目标 24 → 28px:贴着 web-target-size 下限,再大 meta 行要换行 */
      padding: 6px 12px;
      font-size: 11px;
      font-family: var(--font-sans);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted-2);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--t-fast) ease, color var(--t-fast) ease, border-color var(--t-fast) ease;
      min-height: 28px;
      line-height: 1;
    }
    .copy-btn:hover {
      /* 反色 hover:深底白字,工具感强 */
      background: var(--fg);
      color: var(--on-accent);
      border-color: var(--fg);
    }
    .copy-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    .del-btn {
      /* 删除按钮:样式与复制按钮同构,hover 走 danger 红,提示破坏性 */
      padding: 6px 12px;
      font-size: 11px;
      font-family: var(--font-sans);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted-2);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--t-fast) ease, color var(--t-fast) ease, border-color var(--t-fast) ease;
      min-height: 28px;
      line-height: 1;
    }
    .del-btn:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: #FCEBEB;
    }
    .del-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    .del-btn:disabled {
      color: var(--muted);
      border-color: var(--border);
      cursor: not-allowed;
    }

    .msg-text {
      font-size: 14px;
      line-height: 1.65;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      color: var(--fg);
    }
    .msg-text a {
      /* 链接不用彩色,用下划线 + mono,凸显「这是 URL 字符串」 */
      color: var(--fg);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 1px;
      text-decoration-color: var(--border-strong);
      font-family: var(--font-mono);
      font-size: 0.95em;
      transition: text-decoration-color var(--t-fast) ease;
    }
    .msg-text a:hover { text-decoration-color: var(--fg); }
    .msg-text a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
      border-radius: 2px;
    }

    /* ===== 图片消息 ===== */
    .msg-imgbox { margin-top: 8px; }
    .msg-img {
      display: block;
      max-width: 100%;
      /* 自适应屏高:竖拍照片占约半屏,不再固定 320px 把手机照片拍成小缩略图;
         dvh 更贴移动端可视高度,不支持的内核退回 vh */
      max-height: min(60vh, 520px);
      max-height: min(60dvh, 520px);
      height: auto;                    /* 配合 width/height 属性保比例,防布局跳动 */
      object-fit: contain;             /* 兜底旧消息:万一盒子比例对不上,letterbox 而非拉伸 */
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: #F5F5F4;             /* 加载中 / 透明图的衬底 */
      cursor: zoom-in;                 /* 暗示可点开看大图 */
      transition: border-color var(--t-fast) ease;
    }
    .msg-img:hover { border-color: var(--fg); }
    .msg-img:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
    /* 长图/全景(最长边 ≥ 2.5 倍短边):按原比例展示会被高度上限压成
       几十像素宽的细缝,改固定尺寸裁切卡做预览,完整内容点 lightbox 看 */
    .msg-imgcard {
      position: relative;
      width: min(240px, 100%);
      height: 280px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: #F5F5F4;
      overflow: hidden;
      cursor: zoom-in;
      transition: border-color var(--t-fast) ease;
    }
    .msg-imgcard:hover { border-color: var(--fg); }
    .msg-imgcard .msg-img {
      width: 100%;
      height: 100%;
      max-width: none;                 /* 裁切交给卡片,img 只管撑满 */
      max-height: none;
      object-fit: cover;
      border: none;
    }
    .msg-imgbadge {
      position: absolute;
      right: 6px;
      bottom: 6px;
      pointer-events: none;            /* 角标不挡点击,点击统一落到图片上 */
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--on-accent);
      background: rgba(28, 25, 23, 0.82);
      padding: 1px 6px;
      border-radius: 2px;
    }

    /* 折叠长内容:深色左色条 + 灰底卡片,一眼看出「这里有折叠」。
       卡片外观画在 .fold-box 上;<details> 只负责折叠条与全文,
       预览是它的兄弟节点 —— 收起态的 <details> 会隐藏非 summary 子元素,
       预览放 details 里面的话,收起时根本不渲染(旧版「只见展开、不见预览」的根因) */
    .fold-box {
      margin-top: 4px;
      border: 1px solid var(--border-strong);
      border-left: 3px solid var(--fg);   /* 左侧深墨黑色条,主色强对比 */
      border-radius: var(--radius);
      background: #F5F5F4;               /* stone-100,和普通消息拉开层次 */
      overflow: hidden;
    }
    details.fold > summary.fold-bar {
      list-style: none;                   /* 去掉默认三角,自己画 */
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--fg);                   /* 主色,不再 muted 灰 */
      user-select: none;
      transition: background var(--t-fast) ease;
    }
    details.fold > summary.fold-bar::-webkit-details-marker { display: none; }
    details.fold > summary.fold-bar::marker { display: none; content: ''; }
    details.fold > summary.fold-bar::before {
      content: '▸';
      font-size: 10px;
      color: var(--fg);
      transition: transform var(--t-fast) ease;
    }
    details.fold[open] > summary.fold-bar::before { transform: rotate(90deg); }
    details.fold > summary.fold-bar:hover { background: #EAEAE8; }
    details.fold > summary.fold-bar:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 3px var(--ring);
    }
    .fold-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--on-accent);
      background: var(--fg);             /* 深底白字 badge,强对比 */
      padding: 1px 6px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .fold-label { font-weight: 500; }
    .fold-label b { font-family: var(--font-mono); font-weight: 600; }
    .fold-hint { color: var(--muted-2); }
    .fold-preview {
      padding: 4px 12px 10px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted-2);
      border-top: 1px dashed var(--border-strong);
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-height: 132px;
      overflow: hidden;
      position: relative;
      font-family: var(--font-mono);     /* 代码预览用等宽,凸显「这是代码片段」 */
    }
    /* 预览底部渐变,暗示「下面还有更多」 */
    .fold-preview::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 22px;
      background: linear-gradient(to bottom, transparent, #F5F5F4);
      pointer-events: none;
    }
    /* 展开后:隐藏兄弟节点上的预览,只显示全文(全文懒加载注入) */
    details.fold[open] + .fold-preview { display: none; }
    .fold-full { padding: 8px 12px 10px; }
    .fold-full:empty { display: none; }

    .empty, .loading {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 48px 0;
      letter-spacing: 0.02em;
    }

    .self-badge {
      /* 边框改 stone,不再用蓝色 */
      font-size: 10px;
      color: var(--muted-2);
      border: 1px solid var(--border-strong);
      padding: 0 5px;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }

    /* ===== 图片 lightbox 全屏预览 ===== */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      flex-direction: column;
      background: rgba(28, 25, 23, 0.92);   /* 深墨黑遮罩,与主色同源 */
    }
    .lightbox.open { display: flex; }
    .lb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      font-size: 12px;
    }
    .lb-name {
      font-family: var(--font-mono);
      color: rgba(250, 250, 249, 0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .lb-btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      background: transparent;
      color: #FAFAF9;
      border: 1px solid rgba(250, 250, 249, 0.35);
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      min-height: 32px;
      line-height: 1.2;
      transition: background var(--t-fast) ease, border-color var(--t-fast) ease;
    }
    .lb-btn:hover { background: rgba(250, 250, 249, 0.12); border-color: #FAFAF9; }
    .lb-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(250, 250, 249, 0.3);
    }
    /* 图片舞台:高度由 flex 撑满遮罩,不再用 100vh 硬算 —— 规避 iOS 工具栏遮挡;
       图片完整显示,点图片外的空白关闭 */
    .lb-stage {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;    /* 触屏滚到边界不连带背景页面 */
      padding: 0 16px 16px;
      padding: 0 16px max(16px, env(safe-area-inset-bottom));
    }
    .lb-img {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      max-height: 100%;                /* 完整塞进舞台 */
      object-fit: contain;
    }

    /* ===== toast 轻提示:替代阻塞式 alert,底部浮出自动消失;
       aria-live=polite 让屏幕阅读器也能听到 ===== */
    #toast-zone {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;            /* 容器不挡点击,单条 toast 可选中复制 */
      max-width: min(92vw, 480px);
    }
    .toast {
      pointer-events: auto;
      background: var(--fg);
      color: var(--on-accent);
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 16px;
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity var(--t-base) ease, transform var(--t-base) ease;
      max-width: 100%;
      word-break: break-word;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.err { background: var(--danger); }

    /* ===== reduced-motion 兜底(原来完全缺失) ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading">加载中…</div></div>
  <script>
    // ============ 工具函数 ============
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function linkify(s) {
      // 在已 escape 的字符串上做 URL 自动链接
      return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }
    function relTime(ts) {
      const now = Date.now();
      const diff = Math.floor((now - ts * 1000) / 1000);
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      if (diff < 7 * 86400) return Math.floor(diff / 86400) + ' 天前';
      const d = new Date(ts * 1000);
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function fmtSize(n) {
      return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
    }
    // 随机房间名:8 位 hex,做一次性传输管道用(与图片 id 同一随机源思路)
    function genRoomId() {
      const buf = new Uint8Array(4);
      crypto.getRandomValues(buf);
      return Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    // 可点 chip 的 a11y 收口:role=button + tabindex + Enter/Space 触发
    function chipActivate(el, fn) {
      if (!el) return;
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.onclick = fn;
      el.onkeydown = function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
      };
    }

    // ============ 全局运行态:renderBoard 重绘不丢的东西都挂模块作用域 ============
    const root = document.getElementById('root');
    let currentMessages = [];   // 供复制按钮/图片点击按索引取原文
    let pendingImg = null;      // 待发图片 { blob, mime, w, h, name, url } —— 重绘/回登录页都不丢
    let uploadXhr = null;       // 进行中的上传 XHR(可取消)
    let lastRoom = null;        // 上次渲染的房间(轮询防重绘 + 未读计数用)
    let lastIdSet = new Set();  // 上次渲染的消息 id 集合
    let unread = 0;             // 未读新消息数(标签页标题角标)
    let pollTimer = null;       // 30s 轮询句柄
    let panelOpener = null;     // 打开内联面板前的触发元素(关闭时还焦)
    const TITLE_BASE = document.title;

    // ============ 身份（昵称 + 颜色，存 localStorage） ============
    function getIdentity() {
      let hash = localStorage.getItem('anon_hash');
      if (!hash) {
        const buf = new Uint8Array(4);
        crypto.getRandomValues(buf);
        hash = Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('anon_hash', hash);
      }
      let color = localStorage.getItem('anon_color');
      if (!color) {
        color = 'hsl(' + Math.floor(Math.random() * 360) + ', 65%, 55%)';
        localStorage.setItem('anon_color', color);
      }
      let name = localStorage.getItem('anon_name');
      if (!name) {
        name = '#' + hash; // 没改过名时用随机 hash 当默认名
        localStorage.setItem('anon_name', name);
      }
      return { name: name, color: color };
    }

    // ============ 房间：URL #r=房间名 ============
    function getRoom() {
      const p = new URLSearchParams(location.hash.replace(/^#/, ''));
      const r = p.get('r') || 'main';
      return /^[a-zA-Z0-9_-]{1,32}$/.test(r) ? r : 'main';
    }

    // ============ 草稿持久化:按房间存 localStorage ============
    // renderBoard 整树重绘(发送 401 / 删消息 / 改名 / 轮询换数据)都会重建 composer,
    // 不持久化的话正在输入的草稿会被无声清空 —— 对「传 10 万字代码」的工具是最伤的。
    function draftKey(room) { return 'note220:draft:' + room; }
    function saveDraft(room, text) {
      try {
        if (text) localStorage.setItem(draftKey(room), text);
        else localStorage.removeItem(draftKey(room));
      } catch (e) { /* 存储满/隐私模式:草稿退化为仅内存 */ }
    }
    function loadDraft(room) {
      try { return localStorage.getItem(draftKey(room)) || ''; } catch (e) { return ''; }
    }

    // ============ 最近房间(localStorage 存最近 8 个):换房面板的点即跳 ============
    function recentRooms() {
      try { return JSON.parse(localStorage.getItem('note220:rooms') || '[]') || []; } catch (e) { return []; }
    }
    function pushRecentRoom(room) {
      if (!room) return;
      const list = recentRooms().filter(function (r) { return r !== room; });
      list.unshift(room);
      try { localStorage.setItem('note220:rooms', JSON.stringify(list.slice(0, 8))); } catch (e) {}
    }

    // ============ toast 轻提示:替代阻塞式 alert ============
    function showToast(msg, isErr) {
      let zone = document.getElementById('toast-zone');
      if (!zone) {
        zone = document.createElement('div');
        zone.id = 'toast-zone';
        zone.setAttribute('aria-live', 'polite');
        document.body.appendChild(zone);
      }
      const t = document.createElement('div');
      t.className = 'toast' + (isErr ? ' err' : '');
      t.textContent = msg;
      zone.appendChild(t);
      requestAnimationFrame(function () { t.classList.add('show'); });
      setTimeout(function () {
        t.classList.remove('show');
        setTimeout(function () { t.remove(); }, 300);
      }, 2600);
    }

    // ============ composer 内联错误(role=alert,发送/上传失败落这里) ============
    function setComposerErr(msg) {
      const el = document.getElementById('composer-err');
      if (!el) return;
      el.textContent = msg || '';
      el.hidden = !msg;
    }

    // ============ 轮询 + 未读角标 ============
    // 页面可见时 30s 拉一次;回前台立即拉一次。列表无变化(比对新消息 id 集合)不重绘,
    // 打字时焦点绝不被重绘打断。后台/失焦期间到达的新消息计入标题角标,回前台清零。
    function updateTitle() {
      document.title = unread > 0 ? '(' + unread + ') ' + TITLE_BASE : TITLE_BASE;
    }
    function clearUnread() {
      if (unread !== 0) { unread = 0; updateTitle(); }
    }
    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(function () {
        if (document.visibilityState === 'visible') loadBoard({ silent: true });
      }, 30000);
    }
    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    window.addEventListener('focus', clearUnread);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        clearUnread();
        loadBoard({ silent: true });   // 切回页面立即对齐数据,不等下一个 30s
      }
    });

    // ============ 全局键盘:Esc 关 lightbox/面板;Tab 在 lightbox 内打圈(焦点陷阱) ============
    document.addEventListener('keydown', function (e) {
      const lb = document.getElementById('lightbox');
      const lbOpen = lb && lb.classList.contains('open');
      if (e.key === 'Escape') {
        if (lbOpen) { closeLightbox(); return; }
        closePanels();
        return;
      }
      if (e.key === 'Tab' && lbOpen) {
        const f = lb.querySelectorAll('a[href], button');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (!lb.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    // ============ 内联面板(换房 / 改名):替代阻塞式 prompt ============
    function closePanels(restoreFocus) {
      const rp = document.getElementById('room-panel');
      const np = document.getElementById('name-panel');
      let wasOpen = false;
      if (rp && !rp.hidden) { rp.hidden = true; wasOpen = true; }
      if (np && !np.hidden) { np.hidden = true; wasOpen = true; }
      if (wasOpen && restoreFocus !== false && panelOpener && panelOpener.isConnected) panelOpener.focus();
      panelOpener = null;
    }
    function toggleRoomPanel() {
      const p = document.getElementById('room-panel');
      if (p && !p.hidden) { closePanels(); return; }
      closePanels(false);
      panelOpener = document.getElementById('room-chip');
      p.hidden = false;
      const recents = recentRooms().filter(function (r) { return r !== getRoom(); });
      p.innerHTML =
        '<h2>换房 / 开新房</h2>' +
        '<div class="panel-row">' +
          '<input id="room-input" maxlength="32" placeholder="房间名（1-32 位字母/数字/ - / _）" autocomplete="off" aria-label="房间名">' +
          '<button id="room-go" class="panel-btn" type="button">进入</button>' +
        '</div>' +
        (recents.length
          ? '<p class="recent-label">最近去过的房间</p><div class="recent-rooms">' +
            recents.map(function (r) {
              return '<button type="button" class="rr-chip" data-room="' + escapeHtml(r) + '">#' + escapeHtml(r) + '</button>';
            }).join('') + '</div>'
          : '') +
        '<div class="panel-row panel-foot">' +
          '<button id="room-random" class="panel-btn ghost" type="button">随机新房</button>' +
          '<button id="room-cancel" class="panel-btn ghost" type="button">取消</button>' +
        '</div>';
      const input = document.getElementById('room-input');
      const go = function () {
        const v = input.value.trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 32);
        if (!v) { input.focus(); return; }
        if (v !== getRoom()) location.hash = 'r=' + v;   // 触发 hashchange → loadBoard
        closePanels();
      };
      document.getElementById('room-go').onclick = go;
      input.onkeydown = function (e) { if (e.key === 'Enter') go(); };
      p.querySelectorAll('.rr-chip').forEach(function (c) {
        c.onclick = function () {
          const r = c.getAttribute('data-room');
          if (r && r !== getRoom()) location.hash = 'r=' + r;
          closePanels();
        };
      });
      document.getElementById('room-random').onclick = function () { input.value = genRoomId(); input.focus(); };
      document.getElementById('room-cancel').onclick = function () { closePanels(); };
      input.focus();
    }
    function toggleNamePanel() {
      const p = document.getElementById('name-panel');
      if (p && !p.hidden) { closePanels(); return; }
      closePanels(false);
      panelOpener = document.getElementById('name-chip');
      p.hidden = false;
      p.innerHTML =
        '<h2>改名字</h2>' +
        '<div class="panel-row">' +
          '<input id="name-input" maxlength="64" placeholder="你叫什么（发消息时显示，≤64 字符）" autocomplete="off" aria-label="昵称">' +
          '<button id="name-save" class="panel-btn" type="button">保存</button>' +
        '</div>' +
        '<div class="panel-row panel-foot">' +
          '<button id="name-cancel" class="panel-btn ghost" type="button">取消</button>' +
        '</div>';
      const input = document.getElementById('name-input');
      input.value = getIdentity().name;
      const save = function () {
        const v = input.value.trim().slice(0, 64);
        if (!v) { input.focus(); return; }
        localStorage.setItem('anon_name', v);
        closePanels();
        loadBoard();   // 草稿在 localStorage 里,重绘后自动恢复,改名不再丢草稿
      };
      document.getElementById('name-save').onclick = save;
      input.onkeydown = function (e) { if (e.key === 'Enter') save(); };
      document.getElementById('name-cancel').onclick = function () { closePanels(); };
      input.focus();
      input.select();
    }

    // ============ 图片全屏预览(lightbox):点缩略图进来,可下载原图 ============
    // lightbox 挂在 body 上(不在 #root 里),renderBoard 重渲染不会弄丢它。
    // 焦点管理:打开圈焦进对话框 + Tab 焦点陷阱,关闭把焦点还给触发元素。
    let lbLastFocus = null;
    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      if (!lb) return;
      lb.classList.remove('open');
      document.body.style.overflow = '';   // 解锁背景滚动
      if (lbLastFocus && lbLastFocus.isConnected) lbLastFocus.focus();
      lbLastFocus = null;
    }
    function openLightbox(m) {
      let lb = document.getElementById('lightbox');
      if (!lb) {
        lb = document.createElement('div');
        lb.id = 'lightbox';
        lb.className = 'lightbox';
        lb.innerHTML =
          '<div class="lb-bar">' +
            '<span class="lb-name"></span>' +
            '<span class="lb-actions">' +
              '<a id="lb-dl" class="lb-btn" href="#">下载</a>' +

    function renderAuth() {
      stopPolling();
      root.innerHTML =

            '<label class="remember">' +
              '<input type="checkbox" id="remember-chk"> ' +
              '<span>记住我（自己的设备勾：1 年免输；陌生电脑别勾：30 分钟自动过期）</span>' +
            '</label>' +
            '<button id="token-btn">进入</button>' +
            '<div class="err" id="token-err" role="alert"></div>' +
          '</div>' +
        '</div>';
      const input = document.getElementById('token-input');
      const chk = document.getElementById('remember-chk');
      const btn = document.getElementById('token-btn');
      const err = document.getElementById('token-err');
      async function submit() {
        const token = input.value.trim();
        if (!token) { err.textContent = '请输入令牌'; return; }
        btn.disabled = true; btn.textContent = '验证中…';
        try {
          const r = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, remember: chk.checked }),
          });
          if (r.ok) {
            await loadBoard();
            return;
          }
          btn.disabled = false; btn.textContent = '进入';
          if (r.status === 429) {
            err.textContent = '尝试太频繁，被暂时拦下了，10 分钟后再来';
          } else if (r.status === 500) {
            err.textContent = '服务器未配置 ROOM_TOKEN（HTTP 500），看 README 排查';
          } else if (r.status === 401) {
            err.textContent = '令牌不对，再试';
          } else {
            err.textContent = '出错 (HTTP ' + r.status + ')';
          }
        } catch (e) {
          btn.disabled = false; btn.textContent = '进入';
          err.textContent = '网络错误';
        }
      }
      btn.onclick = submit;
      input.onkeydown = function (e) { if (e.key === 'Enter') submit(); };
      input.focus();

    function renderBoard(messages) {
      currentMessages = messages;

      // ---- 重绘前状态保全:焦点/光标/滚动位置/展开的折叠 ----

      const prevTa = document.getElementById('msg-input');

      const openFolds = Array.prototype.map.call(

        ? '<div class="empty">空房间。传点东西，把链接发出去。</div>'
        : '<ul class="messages">' + messages.map(function (m, i) {
            const author = m.name || m.user_hash || 'unknown'; // user_hash 兼容旧数据
            const isSelf = author === self.name;
            // 超长内容:折叠 + 预览 + 懒加载全文。
            // 关键修复:不再在渲染时对整段超长文本做 escape+linkify 再塞进 DOM,
            // 否则即便 <details> 折叠了,浏览器仍要解析几万字符的 DOM → 页面卡顿,
            // 看起来就像「折叠没生效」。改为只渲染预览,展开时再懒加载全文。
            // 折叠判断 = 行数优先 + 字符数兜底:
            //   行数(逻辑行,按换行符切)超过 6 行 → 折叠,预览只露前 6 行,长代码(几乎都多行)一眼即收;
            //   兜底:超过 2000 字符也折叠——压缩 JS / base64 / 超长 URL 一整行没有换行,
            //   按行数只有 1 行,不兜底会糊满全屏。
            const FOLD_LINES = 6, FOLD_AT = 2000, PREVIEW_LINES = 6, PREVIEW_CHARS = 600;
            const hasText = typeof m.text === 'string' && m.text.length > 0;
            let textHtml = '';
            if (hasText) {
              // 统一 \r\n / \r 为 \n(Windows 剪贴板是 \r\n),去掉结尾空行后按 \n 切逻辑行
              const lines = m.text.replace(/\r\n?/g, '\n').replace(/\n+$/, '').split('\n');
              const lineCount = lines.length;
              const byLines = lineCount > FOLD_LINES;   // 7 行起折叠:正好 6 行折了也只露 6 行,折叠条没有意义
              const byChars = m.text.length > FOLD_AT;
              if (byLines || byChars) {
                // 预览 = 前 6 个逻辑行,再统一限 600 字:拦住「单行 3 万字符」把预览 DOM 撑大
                const previewText = lines.slice(0, PREVIEW_LINES).join('\n').slice(0, PREVIEW_CHARS);
                const previewHtml = linkify(escapeHtml(previewText));
                // 文案跟触发条件走:行数触发按行展示,兜底触发按字展示(与旧版一致)
                const label = byLines
                  ? '展开全部（共 <b>' + lineCount.toLocaleString() + '</b> 行）'

                const hint = byLines
                  ? '（预览 ' + PREVIEW_LINES + ' 行 · 剩余 ' + (lineCount - PREVIEW_LINES).toLocaleString() + ' 行 · 点「复制」可直接拿走全文）'
                  : '（预览 ' + previewText.length.toLocaleString() + ' 字 · 剩余 ' + (m.text.length - previewText.length).toLocaleString() + ' 字 · 点「复制」可直接拿走全文）';
                // 结构:.fold-preview 放在 <details> 外面做兄弟节点 ——
                // 收起态的 details 隐藏非 summary 子元素,预览放里面收起时不可见;
                // 展开态由 details.fold[open] + .fold-preview 把预览藏掉
                textHtml =
                  '<div class="fold-box">' +
                    '<details class="fold" data-i="' + i + '" data-mid="' + m.id + '">' +
                      '<summary class="fold-bar">' +
                        '<span class="fold-tag">长文</span>' +
                        '<span class="fold-label">' + label + '</span>' +
                        '<span class="fold-hint">' + hint + '</span>' +
                      '</summary>' +

              } else {
                textHtml = '<div class="msg-text">' + linkify(escapeHtml(m.text)) + '</div>';
              }
            }
            // 图片部分(可无):懒加载,本体走 /api/img 独立通道;
            // width/height 属性让浏览器提前占位,加载不跳版。
            // 渲染时已知的 w/h 顺便用来分流展示:常规图自适应(占满消息栏宽,
            // 高不超 60vh);长图/全景(最长边 ≥ 2.5 倍短边)转固定裁切卡 + 角标 ——
            // 原比例展示会把 1:8 的长截图压成几十像素宽的细缝,没法看
            let imgHtml = '';
            if (m.img) {
              const isLongImg = !!(m.w && m.h) && Math.max(m.w, m.h) / Math.min(m.w, m.h) > 2.5;

              // 会各自独立截断、不保比例,竖拍照片会被拉宽变形;先给 vh 再给 dvh 做降级
              const fitStyle = m.w && m.h
                ? ' style="width:min(100%,calc(min(60vh,520px)*' + (m.w / m.h).toFixed(4) + '));' +

                : '';
              // alt 带语义:作者 + 尺寸,屏幕阅读器和图挂了的人都能知道这是什么
              const altText = escapeHtml((m.name || '未知') + ' 的图片' + (m.w && m.h ? ' ' + m.w + '×' + m.h : ''));
              if (isLongImg) {
                // 长图从顶部开始裁、全景从左侧开始裁,朝阅读起点对齐

                        'style="object-position:' + cropPos + '" data-i="' + i + '">' +
                      '<span class="msg-imgbadge">' + (m.h > m.w ? '长图' : '全景') + '</span>' +
                    '</div>' +
                  '</div>';
              } else {
                imgHtml =
                  '<div class="msg-imgbox">' +
                    '<img class="msg-img" loading="lazy" decoding="async" alt="' + altText + '" ' +
                      'src="/api/img?id=' + encodeURIComponent(m.img) + '" ' + dimAttrs + fitStyle +
                      'data-i="' + i + '">' +
                  '</div>';
              }
            }
            return (
              '<li class="message">' +
                '<div class="avatar" style="background:' + escapeHtml(m.color || '#888') + '" aria-hidden="true"></div>' +
                '<div class="msg-body">' +
                '<div class="msg-meta">' +

                  '<span>' + escapeHtml(relTime(m.ts)) + '</span>' +

                    (hasText ? '<button class="copy-btn" data-i="' + i + '">复制</button>' : '') +
                    '<button class="del-btn" data-i="' + i + '" title="删除（全员可删，不可恢复）" aria-label="删除 ' + escapeHtml(author) + ' 的这条消息">删</button>' +
                  '</span>' +
                '</div>' +
                  textHtml +
                  imgHtml +
                '</div>' +
              '</li>'
            );
          }).join('') + '</ul>';

      root.innerHTML =
        '<div class="container">' +
          '<div class="topbar">' +
            '<h1>note220</h1>' +
            '<div class="actions">' +
              '<button id="copy-link-btn" class="mini-btn">复制链接</button>' +
              '<button id="burn-btn" class="mini-btn burn-btn">焚毁</button>' +
              '<button id="logout-btn" class="mini-btn">退出</button>' +

          '</div>' +
          '<p class="hint">' +
            '房间 <span id="room-chip" class="chip">#' + escapeHtml(room) + '</span>（点击换房/开新房） · ' +
            '你是 <span id="name-chip" class="chip">' + escapeHtml(self.name) + '</span>（点击改名） · ' +

          '</p>' +
          '<div id="room-panel" class="inline-panel" hidden></div>' +
          '<div id="name-panel" class="inline-panel" hidden></div>' +
          '<div class="composer">' +
            '<button id="img-btn" class="composer-img-btn" type="button" title="插入图片（原图直传，≤20MB）" aria-label="插入图片">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>' +
            '</button>' +
            '<textarea id="msg-input" placeholder="传点东西…（文字/代码/链接/图片，文字单条上限 10 万字）" maxlength="100000" aria-label="消息内容"></textarea>' +
            '<button id="msg-btn">发送</button>' +

          '</div>' +
          '<div id="composer-err" class="composer-err" role="alert" hidden></div>' +
          '<div id="attach-strip" class="attach-strip" hidden>' +
            '<div class="strip-main">' +
              '<img id="attach-thumb" class="attach-thumb" alt="待发送图片">' +
              '<div class="attach-meta"><span id="attach-name" class="attach-name"></span><span id="attach-info"></span></div>' +

            '</div>' +
            '<div id="strip-up" class="strip-up" hidden>' +
              '<div id="up-bar" class="up-bar" role="progressbar" aria-label="图片上传进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="up-fill" class="up-fill"></div></div>' +
              '<span id="up-pct" class="up-pct"></span>' +

          '<div id="list">' + listHtml + '</div>' +
        '</div>';

      const ta = document.getElementById('msg-input');
      const btn = document.getElementById('msg-btn');

      // ===== 待发图片(全局 pendingImg):重绘/回登录页都不丢,重绘后重挂条 UI =====
      const imgBtn = document.getElementById('img-btn');
      const imgInput = document.getElementById('img-input');
      const strip = document.getElementById('attach-strip');

      function showPendingImg() {
        if (!pendingImg) { strip.hidden = true; imgInput.value = ''; return; }
        document.getElementById('attach-thumb').src = pendingImg.url;
        document.getElementById('attach-name').textContent = pendingImg.name || '图片';
        document.getElementById('attach-info').textContent =
          pendingImg.w + '×' + pendingImg.h + ' · ' + fmtSize(pendingImg.blob.size) + '（原图）';
        strip.hidden = false;
      }
      function setPendingImg(p) {
        if (pendingImg && pendingImg.url && (!p || p.url !== pendingImg.url)) URL.revokeObjectURL(pendingImg.url);
        pendingImg = p;
        showPendingImg();
      }

      // 上传进度行:XHR upload.onprogress 驱动;fetch 拿不到上传进度,所以上传必须走 XHR
      function showUploadRow(show, loaded, total) {
        const row = document.getElementById('strip-up');
        if (!row) return;
        row.hidden = !show;
        if (!show) return;
        const bar = document.getElementById('up-bar');
        if (total) {
          const pct = Math.min(100, Math.round(loaded / total * 100));
          document.getElementById('up-fill').style.width = pct + '%';
          bar.setAttribute('aria-valuenow', String(pct));
          document.getElementById('up-pct').textContent = fmtSize(loaded) + ' / ' + fmtSize(total);
        } else {
          document.getElementById('up-fill').style.width = '0%';
          bar.setAttribute('aria-valuenow', '0');
          document.getElementById('up-pct').textContent = '准备上传…';
        }
      }

      // <img> 解码:量 w/h,顺带校验「这图浏览器到底能不能显示」。
      // EXIF 方向由浏览器 image-orientation 的默认值 from-image 处理,
      // naturalWidth/Height 拿到的就是摆正后的尺寸(手机竖拍不会横着量)
      function decodeImage(file) {
        return new Promise(function (resolve, reject) {
          const url = URL.createObjectURL(file);
          const im = new Image();
          im.onload = function () { URL.revokeObjectURL(url); resolve(im); };
          im.onerror = function () { URL.revokeObjectURL(url); reject(new Error('unsupported')); };
          im.src = url;
        });
      }

      // 解不动的报错要能落地:HEIC(iPhone 相机「保留原片」格式)单独给解法
      function unsupportedMsg(file) {
        if (/image\/hei[cf]/i.test(file.type || '') || /\.hei[cf]$/i.test(file.name || '')) {
          return 'HEIC 照片这个浏览器解不开：iPhone 请到 设置→相机→格式 选「兼容性最佳」，或先转成 JPEG 再发';
        }
        return '这张图浏览器解不开（可能是不支持的格式）';
      }

      // file.type 缺失或不在白名单时,按文件头重新判型(与服务端 img.js 同一套魔数)
      const UPLOAD_MIMES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'image/avif'];
      function sniffImageMime(file) {
        return file.slice(0, 12).arrayBuffer().then(function (buf) {
          const b = new Uint8Array(buf);
          if (b.length < 12) return '';
          if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'image/jpeg';
          if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image/png';
          if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x38) return 'image/gif';
          if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 &&
              b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
          // AVIF:ISOBMFF 容器,bytes 4-8 是 'ftyp',主品牌 avif(静图)/ avis(动图序列)
          if (b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70) {
            const brand = String.fromCharCode(b[8], b[9], b[10], b[11]);
            if (brand === 'avif' || brand === 'avis') return 'image/avif';
          }
          return '';
        });
      }

      const MAX_UPLOAD_BYTES = 20 * 1024 * 1024;   // 与 img.js 服务端护栏一致(KV 单值上限 25MB,留了余量)

      // 原图直传:不做压缩、不重编码,文件是什么就传什么。
      // prepareImage 只剩三件事:①卡 20MB 上限;②解一遍码拿摆正后的 w/h(占位防跳版 + 长图裁切卡判定);
      // ③拦下浏览器解不开的格式 —— HEIC 这类传上去接收方大概率看不见,提前报错更友好
      async function prepareImage(file) {
        if (file.size > MAX_UPLOAD_BYTES) throw new Error('这张图超过 20MB 上限，换张小的吧');
        let mime = file.type || '';
        if (UPLOAD_MIMES.indexOf(mime) === -1) mime = await sniffImageMime(file);
        if (!mime) throw new Error(unsupportedMsg(file));
        const im = await decodeImage(file).catch(function () { throw new Error(unsupportedMsg(file)); });
        return { blob: file, mime: mime, w: im.naturalWidth, h: im.naturalHeight, name: file.name };
      }

      imgBtn.onclick = function () { imgInput.click(); };
      imgInput.onchange = async function () {
        const f = imgInput.files && imgInput.files[0];
        if (!f) return;
        imgBtn.disabled = true;
        try {
          const p = await prepareImage(f);
          p.url = URL.createObjectURL(p.blob);
          setPendingImg(p);
        } catch (e) {
          showToast(e.message || '图片处理失败', true);
          imgInput.value = '';
        }
        imgBtn.disabled = false;
      };
      document.getElementById('attach-remove').onclick = function () { setPendingImg(null); };
      document.getElementById('up-cancel').onclick = function () {
        if (uploadXhr) uploadXhr.abort();   // onabort → post() 收到 'aborted' 收尾
        setPendingImg(null);
      };

      // Ctrl/⌘+V 粘贴图片:浏览器默认把粘贴进 textarea 的图片直接丢弃(textarea 只收文字),
      // 所以要自己拦 paste 事件,从 clipboardData.items 里抠出位图文件挂到待发区。
      // 只在剪贴板里真有图片时才 preventDefault,纯文字/图文混排的文字部分走默认粘贴。
      ta.addEventListener('paste', async function (e) {
        const items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        let file = null;
        for (const it of items) {
          if (it.kind === 'file' && it.type.indexOf('image/') === 0) {
            file = it.getAsFile();
            break;
          }
        }
        if (!file) return;
        e.preventDefault();
        imgBtn.disabled = true;
        try {
          const p = await prepareImage(file);
          p.name = '剪贴板图片';                 // 截图/复制的图没有有意义的文件名
          p.url = URL.createObjectURL(p.blob);
          setPendingImg(p);
        } catch (err) {
          showToast(err.message || '图片处理失败', true);
        }
        imgBtn.disabled = false;
      });

      // ===== 图片上传(XHR,带进度):fetch 拿不到上传进度,20MB 原图必须给进度条 =====
      // resolve 值三态:{id} 成功 / {err} 失败 / 'aborted' 用户取消 / {auth} 会话过期
      function uploadImage(p) {
        return new Promise(function (resolve) {
          const xhr = new XMLHttpRequest();
          uploadXhr = xhr;
          xhr.open('POST', '/api/img', true);
          xhr.setRequestHeader('Content-Type', p.mime);
          showUploadRow(true, 0, 0);
          xhr.upload.onprogress = function (e) {
            if (e.lengthComputable) showUploadRow(true, e.loaded, e.total);
          };
          xhr.onload = function () {
            uploadXhr = null;
            showUploadRow(false);
            if (xhr.status === 401) { resolve({ auth: true }); return; }
            let j = xhr.response;
            if (typeof j === 'string') { try { j = JSON.parse(j); } catch (e) { j = null; } }
            if (xhr.status >= 200 && xhr.status < 300 && j && j.id) {
              resolve({ id: j.id });
            } else if (xhr.status === 413) {
              resolve({ err: '图片上传失败：超过 20MB 上限' });
            } else if (xhr.status === 415) {
              resolve({ err: '图片上传失败：服务端不认这个格式' });
            } else {
              resolve({ err: '图片上传失败 (HTTP ' + xhr.status + ')' });
            }
          };
          xhr.onerror = function () {
            uploadXhr = null;
            showUploadRow(false);
            resolve({ err: '图片上传失败：网络错误' });
          };
          xhr.onabort = function () {
            uploadXhr = null;
            showUploadRow(false);
            resolve('aborted');
          };
          xhr.send(p.blob);
        });
      }

      async function post() {
        const text = ta.value.trim();
        if (!text && !pendingImg) return;
        btn.disabled = true; btn.textContent = '…';
        setComposerErr('');
        try {
          // 两步走:先传图拿 id,再发消息(消息 JSON 只挂百字节元数据,不塞图片本体)
          let imgFields = {};
          if (pendingImg) {
            const up = await uploadImage(pendingImg);
            if (up === 'aborted') {            // 用户取消:清待发图,回输入态
              btn.disabled = false; btn.textContent = '发送';
              return;
            }
            if (up && up.auth) { renderAuth(); return; }   // 会话过期:草稿已持久化,回来还在
            if (up && up.err) {
              btn.disabled = false; btn.textContent = '发送';
              setComposerErr(up.err);
              return;
            }
            imgFields = { img: up.id, mime: pendingImg.mime, w: pendingImg.w, h: pendingImg.h };
          }
          const r = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              room: getRoom(),
              text: text,
              name: self.name,
              color: self.color,
              ...imgFields,
            }),
          });
          if (r.ok) {
            saveDraft(getRoom(), '');   // 发送成功才清草稿
            ta.value = '';
            setPendingImg(null);
            setComposerErr('');
            await loadBoard();
            ta.focus({ preventScroll: true });
          } else if (r.status === 401) {
            renderAuth(); // 会话过期，回门口重新输令牌（草稿已存 localStorage）
          } else if (r.status === 400) {
            btn.disabled = false; btn.textContent = '发送';
            setComposerErr('发送失败：内容或图片元数据被拒（400）');
          } else {
            btn.disabled = false; btn.textContent = '发送';
            setComposerErr('发送失败 (HTTP ' + r.status + ')');
          }
        } catch (e) {
          btn.disabled = false; btn.textContent = '发送';
          setComposerErr('网络错误，请重试');
        }
      }
      btn.onclick = post;
      ta.onkeydown = function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); post(); }
      };
      // 草稿实时落盘:任何重绘(轮询/删消息/改名/401 回门口)后都能恢复
      ta.addEventListener('input', function () { saveDraft(getRoom(), ta.value); });

      // 每条消息的「复制」按钮 + 图片点开大图（事件委托，一次绑定管整个列表）
      document.getElementById('list').addEventListener('click', async function (e) {
        const t = e.target;
        if (!t.classList) return;
        if (t.classList.contains('msg-img') || t.classList.contains('msg-imgcard')) {
          // 长图裁切卡:点击可能落在卡片容器上,统一从卡内 img 取 data-i
          const im = t.classList.contains('msg-img') ? t : t.querySelector('.msg-img');
          const m = currentMessages[+im.getAttribute('data-i')];
          if (m && m.img) openLightbox(m);
          return;
        }
        if (t.classList.contains('del-btn')) {
          // 撤回：全员可删。confirm 防误触——删除不可恢复，且其他人刷新后即消失。
          const m = currentMessages[+t.getAttribute('data-i')];
          if (!m) return;
          if (!confirm('删除这条消息？（全员可删，不可恢复）')) return;
          t.disabled = true;
          try {
            const r = await fetch('/api/messages?room=' + encodeURIComponent(getRoom()) + '&id=' + encodeURIComponent(m.id), { method: 'DELETE' });
            if (r.status === 401) { renderAuth(); return; }  // 会话过期，回门口重新输令牌
            if (r.ok || r.status === 404) {
              // 404 = 已被别人抢先删掉，刷新列表对齐即可
              showToast('已删除');
              await loadBoard();
            } else {
              t.disabled = false;
              showToast('删除失败 (HTTP ' + r.status + ')', true);
            }
          } catch (err) {
            t.disabled = false;
            showToast('网络错误', true);
          }
          return;
        }
        if (!t.classList.contains('copy-btn')) return;
        const m = currentMessages[+t.getAttribute('data-i')];
        if (!m) return;
        try {
          await navigator.clipboard.writeText(m.text);
          t.textContent = '已复制';
        } catch (err) {
          t.textContent = '失败';
          showToast('复制失败：浏览器没给剪贴板权限', true);
        }
        setTimeout(function () { t.textContent = '复制'; }, 1200);
      });

      // 折叠区懒加载:点开时才把全文 escape+linkify 注入 DOM。
      // 用 capture 捕获 —— toggle 事件在老浏览器不冒泡,捕获阶段兜底。
      document.getElementById('list').addEventListener('toggle', function (e) {
        const dt = e.target;
        if (!dt || !dt.classList || !dt.classList.contains('fold')) return;
        if (!dt.open) return;                       // 收起时不处理
        const full = dt.querySelector('.fold-full');
        if (full && full.getAttribute('data-loaded') === '0') {
          const m = currentMessages[+dt.getAttribute('data-i')];
          if (m) {
            full.innerHTML = '<div class="msg-text">' + linkify(escapeHtml(m.text)) + '</div>';
            full.setAttribute('data-loaded', '1');
          }
        }
      }, true);

      // 点击房间名 / 名字 → 内联面板(不再用阻塞式 prompt,手机体验好一个量级)
      chipActivate(document.getElementById('room-chip'), toggleRoomPanel);
      chipActivate(document.getElementById('name-chip'), toggleNamePanel);

      // 复制本房间链接（发链接给朋友 = 分享这个房间）
      document.getElementById('copy-link-btn').onclick = async function () {
        const that = this;
        try {
          await navigator.clipboard.writeText(location.href);
          that.textContent = '已复制';
        } catch (err) {
          that.textContent = '失败';
          showToast('复制失败：浏览器没给剪贴板权限', true);
        }
        setTimeout(function () { that.textContent = '复制链接'; }, 1200);
      };

      // ===== 焚毁此房间:整间清空(含图片本体),单次 confirm 报房间名防误触 =====
      document.getElementById('burn-btn').onclick = async function () {
        const room = getRoom();
        if (!confirm('焚毁 #' + room + ' —— 整间清空（含图片本体），不可恢复。确定？')) return;
        const that = this;
        that.disabled = true;
        try {
          const r = await fetch('/api/messages?room=' + encodeURIComponent(room) + '&all=1', { method: 'DELETE' });
          if (r.status === 401) { renderAuth(); return; }
          if (r.ok) {
            const j = await r.json().catch(function () { return null; });
            showToast('已焚毁 #' + room + (j && typeof j.burned === 'number' ? '（清掉 ' + j.burned + ' 条）' : ''));
            saveDraft(room, '');        // 房间都没了,草稿一起清
            ta.value = '';
            setPendingImg(null);
            await loadBoard();
          } else {
            showToast('焚毁失败 (HTTP ' + r.status + ')', true);
            that.disabled = false;
          }
        } catch (e) {
          showToast('网络错误', true);
          that.disabled = false;
        }
      };

      // 用完退出：吊销会话 + 清 cookie，回门口（草稿留在 localStorage，重新进门还在）
      document.getElementById('logout-btn').onclick = async function () {
        try { await fetch('/api/auth', { method: 'DELETE' }); } catch (e) {}
        location.reload();
      };

      // ---- 重绘后状态恢复:草稿 → 待发图 → 展开的折叠 → 焦点/光标 → 滚动位置 ----
      ta.value = loadDraft(room);
      showPendingImg();
      openFolds.forEach(function (mid) {
        const d = root.querySelector('details.fold[data-mid="' + mid + '"]');
        if (d) d.open = true;   // 置 open 会触发 toggle → 懒加载全文自动跟上
      });
      if (keepFocus) {
        ta.focus({ preventScroll: true });
        try { ta.setSelectionRange(selS, selE); } catch (e) {}
      } else {
        ta.focus({ preventScroll: true });
      }
      window.scrollTo(0, prevScroll);

      startPolling();
    }

    async function loadBoard(opts) {
      const silent = !!(opts && opts.silent);
      const room = getRoom();
      const listEl = document.getElementById('list');
      if (!silent && listEl) listEl.innerHTML = '<div class="loading">加载中…</div>';
      let r;
      try {
        r = await fetch('/api/messages?room=' + encodeURIComponent(room));
      } catch (e) {
        if (!silent) showToast('网络错误，加载失败', true);
        return;
      }
      if (r.status === 401) { stopPolling(); renderAuth(); return; }
      if (!r.ok) { if (!silent) showToast('加载失败 (HTTP ' + r.status + ')', true); return; }
      let data = null;
      try { data = await r.json(); } catch (e) { return; }
      const msgs = Array.isArray(data && data.messages) ? data.messages : [];
      const idSet = new Set(msgs.map(function (m) { return m.id; }));
      const roomChanged = room !== lastRoom;
      if (roomChanged) { unread = 0; updateTitle(); }   // 换房 = 主动查看,未读清零
      // 防重绘:静默轮询时 id 集合没变就什么都不做 —— 打字/读折叠的人不被打扰
      const changed = roomChanged ||
        idSet.size !== lastIdSet.size ||
        msgs.some(function (m) { return !lastIdSet.has(m.id); });
      if (!changed) return;
      // 后台/失焦期间到达的新消息 → 标题角标计数,回前台由 focus/visibilitychange 清零
      if (silent && !roomChanged && (document.hidden || !document.hasFocus())) {
        let n = 0;
        msgs.forEach(function (m) { if (!lastIdSet.has(m.id)) n++; });
        if (n > 0) { unread += n; updateTitle(); }
      }
      lastRoom = room;
      lastIdSet = idSet;
      renderBoard(msgs);
    }

    async function boot() {
      root.innerHTML = '<div class="loading">加载中…</div>';
      try {
        // 优先消费 <head> 里提前发出的请求;没有(极端兜底)才现发
        const first = window.__firstFetch;
        window.__firstFetch = null;
        const r = await (first || fetch('/api/messages?room=' + encodeURIComponent(getRoom())));
        if (r.status === 401) {
          renderAuth();
        } else if (r.ok) {
          const data = await r.json();
          const room = getRoom();
          const msgs = Array.isArray(data && data.messages) ? data.messages : [];
          lastRoom = room;
          lastIdSet = new Set(msgs.map(function (m) { return m.id; }));
          renderBoard(msgs);
        } else {
          root.innerHTML = '<div class="container"><h1>出错了</h1><p class="hint">HTTP ' + r.status + '，稍后再试。</p></div>';
        }
      } catch (e) {
        root.innerHTML = '<div class="container"><h1>连不上</h1><p class="hint">网络错误，刷新试试。</p></div>';
      }
    }

    // 换房间（点房间名跳转 / 直接改 hash）时重拉数据
    window.addEventListener('hashchange', function () {
      closePanels(false);
      loadBoard();
    });

    boot();
  </script>
</body>
</html>
