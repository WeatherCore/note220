<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>note220 · 快传</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #fafafa;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: #1a1a1a;
    }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .mini-btn {
      padding: 4px 10px;
      font-size: 12px;
      background: #fff;
      color: #4a90e2;
      border: 1px solid #4a90e2;
      border-radius: 5px;
      cursor: pointer;
      transition: background .15s;
    }
    .mini-btn:hover { background: #eef4fc; }
    .hint {
      font-size: 12px;
      color: #888;
      margin: 6px 0 16px;
      line-height: 1.6;
    }
    .chip {
      color: #4a90e2;
      cursor: pointer;
      border-bottom: 1px dashed #9cc3ee;
    }
    .chip:hover { border-bottom-style: solid; }
    /* 令牌输入页 */
    .auth-wrap {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-box {
      width: 100%;
      max-width: 360px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .auth-box h1 { text-align: center; margin-bottom: 8px; }
    .auth-box .hint { text-align: center; }
    .auth-box input[type=password] {
      width: 100%;
      padding: 11px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color .15s;
    }
    .auth-box input[type=password]:focus { border-color: #4a90e2; }
    .remember {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 12px;
      color: #888;
      margin-bottom: 14px;
      cursor: pointer;
      line-height: 1.5;
    }
    .remember input { margin-top: 2px; }
    .auth-box button {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }
    .auth-box button:hover { background: #3a7bc8; }
    .auth-box button:disabled { background: #aaa; cursor: not-allowed; }
    .auth-box .err {
      color: #d33;
      font-size: 12px;
      margin-top: 10px;
      min-height: 16px;
      text-align: center;
    }
    /* 留言板 */
    .composer {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: stretch;
    }
    .composer textarea {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      border: 1px solid #ddd;
      border-radius: 6px;
      resize: vertical;
      min-height: 72px;
      outline: none;
      transition: border-color .15s;
    }
    .composer textarea:focus { border-color: #4a90e2; }
    .composer button {
      padding: 0 22px;
      font-size: 14px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
    }
    .composer button:hover { background: #3a7bc8; }
    .composer button:disabled { background: #aaa; cursor: not-allowed; }
    .composer-hint {
      font-size: 11px;
      color: #aaa;
      margin: 0 0 20px;
    }
    /* 留言列表 */
    .messages { list-style: none; padding: 0; margin: 0; }
    .message {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }
    .message:last-child { border-bottom: none; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-body { flex: 1; min-width: 0; }
    .msg-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .msg-author {
      font-weight: 600;
      font-size: 12px;
      color: #333;
      background: #f0f0f0;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .copy-btn {
      margin-left: auto;
      padding: 1px 8px;
      font-size: 11px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 4px;
      color: #555;
      cursor: pointer;
      flex-shrink: 0;
    }
    .copy-btn:hover { background: #e2e2e2; }
    .msg-text {
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg-text a {
      color: #4a90e2;
      text-decoration: none;
    }
    .msg-text a:hover { text-decoration: underline; }
    details summary {
      cursor: pointer;
      color: #4a90e2;
      font-size: 12px;
      padding: 2px 0;
      user-select: none;
    }
    .empty, .loading {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 36px 0;
    }
    .self-badge {
      font-size: 10px;
      color: #4a90e2;
      border: 1px solid #4a90e2;
      padding: 0 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading">加载中…</div></div>
  <script>
    // ============ 工具函数 ============
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function linkify(s) {
      // 在已 escape 的字符串上做 URL 自动链接
      return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }
    function relTime(ts) {
      const now = Date.now();
      const diff = Math.floor((now - ts * 1000) / 1000);
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
      if (diff < 7 * 86400) return Math.floor(diff / 86400) + ' 天前';
      const d = new Date(ts * 1000);
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    // ============ 身份（昵称 + 颜色，存 localStorage） ============
    function getIdentity() {
      let hash = localStorage.getItem('anon_hash');
      if (!hash) {
        const buf = new Uint8Array(4);
        crypto.getRandomValues(buf);
        hash = Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('anon_hash', hash);
      }
      let color = localStorage.getItem('anon_color');
      if (!color) {
        color = 'hsl(' + Math.floor(Math.random() * 360) + ', 65%, 55%)';
        localStorage.setItem('anon_color', color);
      }
      let name = localStorage.getItem('anon_name');
      if (!name) {
        name = '#' + hash; // 没改过名时用随机 hash 当默认名
        localStorage.setItem('anon_name', name);
      }
      return { name: name, color: color };
    }

    // ============ 房间：URL #r=房间名 ============
    function getRoom() {
      const p = new URLSearchParams(location.hash.replace(/^#/, ''));
      const r = p.get('r') || 'main';
      return /^[a-zA-Z0-9_-]{1,32}$/.test(r) ? r : 'main';
    }

    // ============ 路由：根据登录态渲染不同 UI ============
    const root = document.getElementById('root');
    let currentMessages = []; // 供复制按钮按索引取原文

    function renderAuth() {
      root.innerHTML =
        '<div class="auth-wrap">' +
          '<div class="auth-box">' +
            '<h1>note220</h1>' +
            '<p class="hint">输入共知令牌进入</p>' +
            '<input id="token-input" type="password" placeholder="令牌" autocomplete="off">' +
            '<label class="remember">' +
              '<input type="checkbox" id="remember-chk"> ' +
              '<span>记住我（自己的设备勾：1 年免输；陌生电脑别勾：30 分钟自动过期）</span>' +
            '</label>' +
            '<button id="token-btn">进入</button>' +
            '<div class="err" id="token-err"></div>' +
          '</div>' +
        '</div>';
      const input = document.getElementById('token-input');
      const chk = document.getElementById('remember-chk');
      const btn = document.getElementById('token-btn');
      const err = document.getElementById('token-err');
      async function submit() {
        const token = input.value.trim();
        if (!token) { err.textContent = '请输入令牌'; return; }
        btn.disabled = true; btn.textContent = '验证中…';
        try {
          const r = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, remember: chk.checked }),
          });
          btn.disabled = false; btn.textContent = '进入';
          if (r.ok) {
            await loadBoard();
          } else if (r.status === 500) {
            err.textContent = '服务器未配置 ROOM_TOKEN（HTTP 500），看 README 排查';
          } else if (r.status === 401) {
            err.textContent = '令牌不对，再试';
          } else {
            err.textContent = '出错 (HTTP ' + r.status + ')';
          }
        } catch (e) {
          btn.disabled = false; btn.textContent = '进入';
          err.textContent = '网络错误';
        }
      }
      btn.onclick = submit;
      input.onkeydown = function (e) { if (e.key === 'Enter') submit(); };
      input.focus();
    }

    function renderBoard(messages) {
      currentMessages = messages;
      const room = getRoom();
      const self = getIdentity();
      const listHtml = messages.length === 0
        ? '<div class="empty">空房间。传点东西，把链接发出去。</div>'
        : '<ul class="messages">' + messages.map(function (m, i) {
            const author = m.name || m.user_hash || 'unknown'; // user_hash 兼容旧数据
            const isSelf = author === self.name;
            const bodyHtml = linkify(escapeHtml(m.text));
            // 超长内容折叠成「展开」，避免大段代码撑爆页面
            const textHtml = m.text.length > 2000
              ? '<details><summary>展开全部 ' + m.text.length + ' 字</summary>' +
                  '<div class="msg-text">' + bodyHtml + '</div></details>'
              : '<div class="msg-text">' + bodyHtml + '</div>';
            return (
              '<li class="message">' +
                '<div class="avatar" style="background:' + escapeHtml(m.color || '#888') + '"></div>' +
                '<div class="msg-body">' +
                  '<div class="msg-meta">' +
                    '<span class="msg-author">' + escapeHtml(author) + '</span>' +
                    (isSelf ? '<span class="self-badge">你</span>' : '') +
                    '<span>' + escapeHtml(relTime(m.ts)) + '</span>' +
                    '<button class="copy-btn" data-i="' + i + '">复制</button>' +
                  '</div>' +
                  textHtml +
                '</div>' +
              '</li>'
            );
          }).join('') + '</ul>';

      root.innerHTML =
        '<div class="container">' +
          '<div class="topbar">' +
            '<h1>note220</h1>' +
            '<div class="actions">' +
              '<button id="copy-link-btn" class="mini-btn">复制链接</button>' +
              '<button id="logout-btn" class="mini-btn">退出</button>' +
            '</div>' +
          '</div>' +
          '<p class="hint">' +
            '房间 <span id="room-chip" class="chip">#' + escapeHtml(room) + '</span>（点击换房/开新房） · ' +
            '你是 <span id="name-chip" class="chip">' + escapeHtml(self.name) + '</span>（点击改名） · ' +
            '3 天没人发言本房间自动清空' +
          '</p>' +
          '<div class="composer">' +
            '<textarea id="msg-input" placeholder="传点东西…（文字/代码/链接，单条上限 10 万字）" maxlength="100000"></textarea>' +
            '<button id="msg-btn">发</button>' +
          '</div>' +
          '<div class="composer-hint">Ctrl/⌘ + Enter 发送 · 大段内容会折叠，对方点「复制」一键拿走</div>' +
          '<div id="list">' + listHtml + '</div>' +
        '</div>';

      const ta = document.getElementById('msg-input');
      const btn = document.getElementById('msg-btn');

      async function post() {
        const text = ta.value.trim();
        if (!text) return;
        btn.disabled = true; btn.textContent = '…';
        try {
          const r = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              room: getRoom(),
              text: text,
              name: self.name,
              color: self.color,
            }),
          });
          btn.disabled = false; btn.textContent = '发';
          if (r.ok) {
            ta.value = '';
            await loadBoard();
            ta.focus();
          } else if (r.status === 401) {
            renderAuth(); // 会话过期，回门口重新输令牌
          } else {
            alert('发送失败 (HTTP ' + r.status + ')');
          }
        } catch (e) {
          btn.disabled = false; btn.textContent = '发';
          alert('网络错误');
        }
      }
      btn.onclick = post;
      ta.onkeydown = function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); post(); }
      };

      // 每条消息的「复制」按钮（事件委托，一次绑定管整个列表）
      document.getElementById('list').addEventListener('click', async function (e) {
        const t = e.target;
        if (!t.classList || !t.classList.contains('copy-btn')) return;
        const m = currentMessages[+t.getAttribute('data-i')];
        if (!m) return;
        try {
          await navigator.clipboard.writeText(m.text);
          t.textContent = '已复制';
        } catch (err) {
          t.textContent = '失败';
        }
        setTimeout(function () { t.textContent = '复制'; }, 1200);
      });

      // 点击房间名 → 换房 / 开新房
      document.getElementById('room-chip').onclick = function () {
        const v = prompt('房间名（1-32 位字母/数字/ - / _ ，输入即进入或创建）', getRoom());
        if (v === null) return;
        const clean = v.trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 32);
        if (clean && clean !== getRoom()) location.hash = 'r=' + clean;
      };

      // 点击自己的名字 → 改名
      document.getElementById('name-chip').onclick = function () {
        const v = prompt('你叫什么（发消息时显示，≤64 字符）', getIdentity().name);
        if (v !== null && v.trim()) {
          localStorage.setItem('anon_name', v.trim().slice(0, 64));
          loadBoard();
        }
      };

      // 复制本房间链接（发链接给朋友 = 分享这个房间）
      document.getElementById('copy-link-btn').onclick = async function () {
        const that = this;
        try {
          await navigator.clipboard.writeText(location.href);
          that.textContent = '已复制';
        } catch (err) {
          that.textContent = '失败';
        }
        setTimeout(function () { that.textContent = '复制链接'; }, 1200);
      };

      // 用完退出：吊销会话 + 清 cookie，回门口
      document.getElementById('logout-btn').onclick = async function () {
        try { await fetch('/api/auth', { method: 'DELETE' }); } catch (e) {}
        location.reload();
      };

      ta.focus();
    }

    async function loadBoard() {
      const listEl = document.getElementById('list');
      if (listEl) listEl.innerHTML = '<div class="loading">加载中…</div>';
      try {
        const r = await fetch('/api/messages?room=' + encodeURIComponent(getRoom()));
        if (r.status === 401) {
          renderAuth();
        } else if (r.ok) {
          const data = await r.json();
          renderBoard(data.messages);
        }
      } catch (e) {
        // 忽略，保留原列表
      }
    }

    async function boot() {
      root.innerHTML = '<div class="loading">加载中…</div>';
      try {
        const r = await fetch('/api/messages?room=' + encodeURIComponent(getRoom()));
        if (r.status === 401) {
          renderAuth();
        } else if (r.ok) {
          const data = await r.json();
          renderBoard(data.messages);
        } else {
          root.innerHTML = '<div class="container"><h1>出错了</h1><p class="hint">HTTP ' + r.status + '，稍后再试。</p></div>';
        }
      } catch (e) {
        root.innerHTML = '<div class="container"><h1>连不上</h1><p class="hint">网络错误，刷新试试。</p></div>';
      }
    }

    // 换房间（点房间名跳转 / 直接改 hash）时重拉数据
    window.addEventListener('hashchange', function () {
      loadBoard();
    });

    boot();
  </script>
</body>
</html>
