name = "note220"
compatibility_date = "2024-09-25"
pages_build_output_dir = "./public"

# Cloudflare KV 命名空间绑定
# id 需要在 Cloudflare 后台创建后填入（参考 README.md 的"一次性配置"）
[[kv_namespaces]]
binding = "MESSAGES"
id = "2a483d7164fa4dcc899adf1348cf9930"

# ROOM_TOKEN（寝室令牌）不用写在这里，两种方式任选：
# 1. Dashboard 部署向导的「变量」里填：变量名称 ROOM_TOKEN，值=寝室令牌，点「加密」（推荐，见 README）
# 2. 命令行：npx wrangler pages secret put ROOM_TOKEN --project-name note220
# 本地开发时用 .dev.vars 文件：
#   echo "ROOM_TOKEN=devtoken" > .dev.vars
