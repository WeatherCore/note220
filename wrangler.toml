name = "note-num"
compatibility_date = "2024-09-25"
pages_build_output_dir = "./public"

# Cloudflare KV 命名空间绑定
# id 需要在 Cloudflare 后台创建后填入（参考 README.md 的"一次性配置"）
[[kv_namespaces]]
binding = "MESSAGES"
id = "2a483d7164fa4dcc899adf1348cf9930"

# ROOM_TOKEN 用 secret 设置（不会出现在代码/git 里）：
#   npx wrangler pages secret put ROOM_TOKEN --project-name note-num
# 本地开发时用 .dev.vars 文件：
#   echo "ROOM_TOKEN=devtoken" > .dev.vars
